name: Evaluation tasks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            7.0.x
            9.0.x
            10.0.x
      - name: Restore three projects
        run: dotnet restore Evaluation-tasks.sln
      - name: Build Release
        run: dotnet build Evaluation-tasks.sln -c Release --no-restore
      - name: CSV aggregator smoke checks
        shell: pwsh
        run: ./Evaluation-task2/tests/smoke.ps1
